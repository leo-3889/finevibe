# B4 periodic perf measurement (rebuilt Wave-2 harnesses, see
# dev/perf/README.md). Weekly signal, NOT a gate: every harness step is
# continue-on-error; results ship as artifacts. Windows runner for RSS
# fidelity (Get-CimInstance/Get-Process sampling).
name: perf

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick mode (short idle sample, fewer cycles/samples)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  perf:
    name: Periodic perf harnesses
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      OUT: bench/perf/${{ github.run_id }}
      QUICK: ${{ inputs.quick && '--quick' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: S3 idle RSS growth (15 min; --quick 5 min)
        continue-on-error: true
        shell: bash
        run: node dev/perf/s3-idle-growth.js $QUICK --out "$OUT/s3"

      - name: PO-06 watcher cost baseline
        continue-on-error: true
        shell: bash
        run: node dev/perf/po06-watcher-cost.js $QUICK --out "$OUT/po06"

      - name: F2 Codex rollout scan spike
        continue-on-error: true
        shell: bash
        run: node dev/perf/f2-codex-spike.js $QUICK --out "$OUT/f2"

      - name: F3 Pi session scan tick
        continue-on-error: true
        shell: bash
        run: node dev/perf/f3-pi-tick.js $QUICK --out "$OUT/f3"

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.run_id }}
          path: bench/perf/
          if-no-files-found: warn
