name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major) or explicit version (e.g. 0.3.0)'
        required: true
        default: 'patch'
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run tests
        run: npm test

      - name: Bump version
        # P2-4: the dispatch input reaches the shell only through the env
        # context — it is never interpolated into the script text. The pattern
        # check rejects anything that is not a bump keyword or an explicit
        # semver, so no metacharacter from the input can reach `npm version`.
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          case "$VERSION_INPUT" in
            patch|minor|major) ;;
            *)
              if ! [[ "$VERSION_INPUT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "Invalid version input: $VERSION_INPUT (expected patch/minor/major or X.Y.Z)" >&2
                exit 1
              fi
              ;;
          esac
          npm version "$VERSION_INPUT" --no-git-tag-version

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog via Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_KEY }}
        run: |
          cat <<'PROMPT' | claude -p --allowedTools 'Bash(git:*)' Edit Write Read
          You are updating the changelog for a release in CI.

          The new version is: ${{ steps.version.outputs.version }}
          Today's date is: $(date +%Y-%m-%d)

          Generate release notes and prepend them to CHANGELOG.md:
          - Find the previous version tag: run 'git tag --list "v*" --sort=-version:refname'. The previous tag is the first tag that is NOT v${{ steps.version.outputs.version }}. If no previous tag exists, use the root commit.
          - Collect commits between the previous tag and HEAD using 'git log <range> --pretty=format:"%H %s" --no-merges'.
          - Filter out commits that are NOT user-facing (changelog is for end users of the app, not contributors). For each commit, inspect its changed files via 'git show --name-only --pretty=format: <sha>'. Exclude a commit if ALL of its changed files fall within these paths/patterns:
            - '.github/' (workflows, actions, issue templates, PR templates)
            - '.claude/', '.codex/' (agent/tooling config)
            - Repo meta/docs: 'README.md', 'CLAUDE.md', 'AGENTS.md', 'MARKETING.md', 'CHANGELOG.md', 'LICENSE', any other top-level '*.md'
            - Lint/format/CI config: '.eslintrc*', '.prettierrc*', '.editorconfig', '.nvmrc', '.gitignore', '.gitattributes'
          - Also exclude commits whose subject starts with (case-insensitive): 'ci:', 'ci(', 'chore(ci', 'docs:', 'docs(', 'build(ci', 'release:', 'release(', 'chore(release'.
          - If a commit touches BOTH excluded paths and app code (e.g. 'src/'), keep it — it's user-facing.
          - From the remaining commits, categorize by subject prefix:
            - Features: commits starting with add, feat, implement, introduce, support (case-insensitive)
            - Fixes: commits starting with fix, resolve, patch, correct (case-insensitive)
            - Changes: everything else
          - Strip the prefix keyword and capitalize the first letter of each entry.
          - Consolidate entries that describe the same new feature area. The audience is end users skimming a release blurb, not contributors auditing the diff:
            - Identify "headline" Features — entries that introduce a brand-new tab, panel, modal, board, or major capability for this release.
            - For each headline feature, drop Fix entries scoped to that same area. A brand-new feature has no prior shipped version, so in-development fixes are not user-visible bug fixes — they are part of building the feature.
            - For each headline feature, drop Change entries that describe a sub-aspect of building it out (sub-modal layouts, internal naming, follow-on UI tweaks). Keep a Change only when it is a meaningful evolution of an already-shipped capability.
            - Drop Feature entries that are sub-pieces of a larger headline feature (e.g. if "Team tab" is the headline, drop "Team install-as-agent flag", "Search filter in team browse modal", "Team marketplace grouped by domain").
            - When multiple Feature entries name the same area, fold them into one concise headline. Trim trailing "and X and Y" clauses that just enumerate sub-pieces — keep the user-visible capability, drop the implementation detail.
            - Use the changed file paths from earlier 'git show --name-only' results as a grouping signal: entries whose changed files substantially overlap are likely the same area.
            - Apply conservatively. When unsure whether two entries describe the same area, prefer to group/drop rather than over-list.
          - Format as: '## [${{ steps.version.outputs.version }}] - <YYYY-MM-DD>' followed by sections (Features, Fixes, Changes). Omit empty sections.
          - If CHANGELOG.md doesn't exist, create it with header '# Changelog' and a blank line.
          - Prepend the new entry after the header. Do NOT duplicate if one for this version already exists.

          Do NOT commit, tag, or push. Only update CHANGELOG.md.
          PROMPT

      - name: Verify changelog
        run: grep -q '## \[${{ steps.version.outputs.version }}\]' CHANGELOG.md

      - name: Extract release notes
        run: |
          awk '/^## \[${{ steps.version.outputs.version }}\]/{found=1; next} /^## \[/{if(found) exit} found' CHANGELOG.md > RELEASE_NOTES.md
          echo "Extracted release notes:"
          cat RELEASE_NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

      - name: Commit release
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: v${{ steps.version.outputs.version }}"

      - name: Create annotated tag
        run: git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"

      - name: Get tag name
        id: get-tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists
        run: git rev-parse "${{ steps.get-tag.outputs.tag }}" > /dev/null

      - name: Push commit and tag
        run: |
          git push origin main
          git push origin "${{ steps.get-tag.outputs.tag }}"

  build:
    needs: [prepare]
    runs-on: macos-latest
    # Job-level so `if: env.APPLE_ID` can gate the notarization checks.
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # P1-8: `--publish never` — builds must not race the shared tag;
        # the single `publish` job below uploads every artifact.
        # electron-builder still writes latest-mac.yml into dist/, so the
        # auto-updater feed survives the publish job's aggregate upload.
        run: npm run build && npx electron-builder --publish never --arm64 --x64

      - name: Verify code signatures
        # P1-9: strict deep verification of both built bundles; a broken or
        # tampered signature fails the release here, not on a user's Mac.
        run: |
          for app in dist/mac-arm64/Vibeyard.app dist/mac/Vibeyard.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Verify notarization and Gatekeeper acceptance
        if: env.APPLE_ID != ''
        run: |
          xcrun stapler validate dist/*.dmg
          for dmg in dist/*.dmg; do spctl -a -vv -t install "$dmg"; done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  build-linux:
    needs: [prepare]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # P1-8: `--publish never` — builds must not race the shared tag;
        # the single `publish` job below uploads every artifact.
        run: npm run build && npx electron-builder --linux --publish never --x64

      - name: Verify package integrity
        # P1-9: dpkg parses the deb's control metadata and full contents list
        # (a corrupt/truncated archive fails here). The AppImage gets an ELF
        # magic check; its runtime signature is NOT verified (needs a FUSE
        # loop-mount the runner cannot do). Byte-exact integrity for both is
        # the SHA256SUMS.txt the publish job ships with the release.
        run: |
          dpkg-deb --info dist/*.deb > /dev/null
          dpkg-deb --contents dist/*.deb > /dev/null
          head -c 4 dist/*.AppImage | grep -q "$(printf '\177ELF')"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap

  build-windows:
    needs: [prepare]
    # Pinned to windows-2022: the windows-latest image (now windows-2025)
    # breaks node-gyp's Visual Studio detection when compiling node-pty.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # P1-8: `--publish never` — builds must not race the shared tag;
        # the single `publish` job below uploads every artifact.
        run: npm run build && npx electron-builder --win --publish never --x64

      # P1-9 (documented gap): CI configures no Authenticode certificate, so
      # the Windows exe/zip ship unsigned and `signtool verify` has nothing to
      # validate here. Integrity assurance for this platform is the
      # SHA256SUMS.txt the publish job generates and ships with the release.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  # P1-8: ONE job owns the GitHub release. The three matrix builds used to
  # each run `--publish always` against the same tag, racing release creation
  # and clobbering each other's `latest*.yml` (last writer silently won).
  # The builds now run `--publish never` and hand their dist outputs over as
  # artifacts; this job aggregates them, ships SHA256SUMS.txt next to the
  # binaries (P1-9), and creates the release exactly once.
  publish:
    needs: [prepare, build, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: artifacts

      - name: Generate checksums
        # P1-9: SHA256SUMS.txt is published with the release; consumers run
        # `sha256sum -c SHA256SUMS.txt` in the download directory. The check
        # here proves the generated file is internally consistent.
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -d '' -t ASSETS \
            < <(find artifacts -maxdepth 1 -type f -print0)
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes/RELEASE_NOTES.md \
            --verify-assets \
            "${ASSETS[@]}"

  publish-npm:
    needs: [prepare, build, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
