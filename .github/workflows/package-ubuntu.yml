name: Ubuntu package

# Builds an installable Debian package (.deb) of the current app without
# cutting a release. deb builds need a Linux toolchain because node-pty and
# better-sqlite3 are compiled natively (node-pty ships no linux prebuilds),
# so this cannot run from a Windows/macOS checkout.
#
# Artifacts: download "finevibe-deb-x64" from the run, then on Ubuntu:
#   sudo apt install ./FineVibe-<version>-linux-amd64.deb
#
# Tagged releases already publish the .deb via release.yml's build-linux job;
# this workflow is for ad-hoc installable packages from any branch.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron + electron-builder downloads
        # The npm lock pins the Electron version, so its hash keys the
        # download caches (Electron zips, AppImage tooling). Restored before
        # `npm ci` so the electron postinstall download hits it too.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build && npm run icons

      - name: Package .deb
        run: npx electron-builder --linux deb --x64 --publish never

      - name: Verify package
        run: |
          dpkg-deb --info out/*.deb
          dpkg-deb --contents out/*.deb | grep 'node-pty\|better_sqlite3'
          dpkg-deb --contents out/*.deb | grep 'usr/share/icons/hicolor'
          dpkg-deb --contents out/*.deb | grep 'usr/share/applications/finevibe.desktop'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: finevibe-deb-x64
          path: out/*.deb
          if-no-files-found: error
