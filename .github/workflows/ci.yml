name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only checks out, builds, and tests.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        # windows-2022 (not windows-latest/windows-2025): the 2025 image
        # breaks node-gyp's Visual Studio detection when compiling node-pty.
        os: [macos-latest, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Row 127: pointer-check.js resolves every `path.ts:12` pointer in docs/
      # against the checked-out tree: unresolvable, past-EOF, ambiguous.
      # Node builtins only (fs/path); the index skips node_modules/dist/
      # build/coverage/dev: no npm ci, no build needed. Runs in ~0.04s.
      # Non-blocking on purpose: the tip already has findings, so a hard step
      # would be red on every push. Blockers to clear first:
      #   17 unresolvable — docs/packaging.md → electron-builder internals
      #   app-builder-lib/out/*, dmg-builder/out/dmg.js, macPackager.js,
      #   macCodeSign.js: all under node_modules, which the index skips;
      #   docs/performance.md → dev/ spike scripts (po06-watcher-cost.js,
      #   f2-codex-spike.js, f3-pi-tick.js) and dist chunks (index.js,
      #   chunk-*.js); docs/FEATURES.md → a test file not yet committed
      #   (src/main/launch-session-dir.systemprompt.test.ts).
      #   1 past EOF — docs/security-boundaries.md cites
      #   `src/main/ipc-handlers.ts:2434-2441` on a 1980-line file.
      # TODO(row-127): delete the next line once docs/ is clean → hard gate.
      - name: Doc pointer check
        run: node dev/audit/pointer-check.js docs
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Row 80 pulled forward to every push: `npm run icons` regenerates the
        # tracked build/ masters from assets/icon-source.png, so diffing them
        # right after fails the push that left the committed bytes stale.
        # release.yml has the same check, but it only fires at release time.
        run: npm run build && npm run icons
          && git diff --exit-code -- build/

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild better-sqlite3 for the Node ABI
        # Row 61: `npm ci` postinstall runs `electron-builder install-app-deps`
        # and puts better-sqlite3 on the Electron ABI, which plain-Node vitest
        # cannot load — the chrome-import cookies/importer suites would
        # self-skip on every leg. No packaging here, so no Electron-ABI
        # restore step is needed afterwards.
        run: npm rebuild better-sqlite3

      - name: Run tests
        run: npm test
