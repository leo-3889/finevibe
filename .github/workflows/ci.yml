name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only checks out, builds, and tests.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        # windows-2022 (not windows-latest/windows-2025): the 2025 image
        # breaks node-gyp's Visual Studio detection when compiling node-pty.
        os: [macos-latest, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build && npm run icons

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
