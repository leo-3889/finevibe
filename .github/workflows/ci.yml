name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only checks out, builds, and tests.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        # windows-2022 (not windows-latest/windows-2025): the 2025 image
        # breaks node-gyp's Visual Studio detection when compiling node-pty.
        os: [macos-latest, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Row 80 pulled forward to every push: `npm run icons` regenerates the
        # tracked build/ masters from assets/icon-source.png, so diffing them
        # right after fails the push that left the committed bytes stale.
        # release.yml has the same check, but it only fires at release time.
        run: npm run build && npm run icons
          && git diff --exit-code -- build/

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild better-sqlite3 for the Node ABI
        # Row 61: `npm ci` postinstall runs `electron-builder install-app-deps`
        # and puts better-sqlite3 on the Electron ABI, which plain-Node vitest
        # cannot load — the chrome-import cookies/importer suites would
        # self-skip on every leg. No packaging here, so no Electron-ABI
        # restore step is needed afterwards.
        run: npm rebuild better-sqlite3

      - name: Run tests
        run: npm test
